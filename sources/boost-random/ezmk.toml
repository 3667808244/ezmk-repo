# boost-random

Boost.random — Random number generation (header-only subset)

- **Version**: 1.88.0 (Boost release)
- **License**: Boost Software License 1.0
- **Type**: Header-only
- **Source**: [boostorg/random](https://github.com/boostorg/random)
- **Dependencies**: boost-config, boost-assert, boost-core, boost-static-assert, boost-throw-exception
- **NOTE**: Headers need to be downloaded from upstream. Run: git clone --depth 1 https://github.com/boostorg/random.git boost_temp/random and copy include/boost/ to this package.

## Usage

Add to your ezmk.toml:
`	oml
[depends]
lib = ["boost-random"]
`
